services:
  ss-backend:
    build:
      context: ./ss-backend
    container_name: ss-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ss-backend:/app
      - maven-cache:/root/.m2
    ports:
      - "8090:8090"

  ss-web:
    build:
      context: ./skill-swap-web
      dockerfile: Dockerfile.dev
    container_name: ss-web
    working_dir: /app
    depends_on:
      - ss-backend
    volumes:
      - ./skill-swap-web:/app
      - web-node-modules-v2:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  maven-cache:
  web-node-modules-v2:

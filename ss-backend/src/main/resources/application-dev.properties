# ── Dev profile ──────────────────────────────────────────────────────────────
# Skraca efektywny czas trwania sesji: 60 min * 0.01 = 36 sekund.
# Używane w TutorOfferService.confirmPayment() do sprawdzenia czy sesja się skończyła.
session.time.multiplier=0.01

# Cache TTL: 1 minuta zamiast 60, żeby XP i dane usera odświeżały się szybko po zmianach.
cache.ttl.minutes=1

# Szczegółowe logi tylko dla naszego kodu (bez Spring Security spamu).
logging.level.com.tutoring.app=DEBUG
logging.level.org.springframework.security=WARN
